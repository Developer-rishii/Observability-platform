version: '3.8'

services:
  demo-db:
    image: postgres:15
    container_name: demo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DEMO_DB_USER:-demouser}
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD:-demopassword}
      POSTGRES_DB: ${DEMO_DB_NAME:-demodb}
    volumes:
      - demo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DEMO_DB_USER:-demouser} -d ${DEMO_DB_NAME:-demodb}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - "monitor=true"
    deploy:
      resources:
        limits:
          memory: 512M

  demo-app:
    build:
      context: ./infrastructure/workload-generator
      dockerfile: Dockerfile
    container_name: demo-app
    restart: unless-stopped
    labels:
      - "monitor=true"
    ports:
      - "${WORKLOAD_HOST_PORT:-8081}:8080"
    environment:
      - DEMO_DB_HOST=demo-db
      - DEMO_DB_PORT=5432
      - DEMO_DB_USER=${DEMO_DB_USER:-demouser}
      - DEMO_DB_PASSWORD=${DEMO_DB_PASSWORD:-demopassword}
      - DEMO_DB_NAME=${DEMO_DB_NAME:-demodb}
      - DEMO_DB_URL=postgresql://${DEMO_DB_USER:-demouser}:${DEMO_DB_PASSWORD:-demopassword}@demo-db:5432/${DEMO_DB_NAME:-demodb}
      - FAULT_TOKEN=${FAULT_TOKEN:-demo-fault-secret-key}
      - DEMO_DATA_DIR=/data/fill
    volumes:
      - demo_app_data:/data/fill
    depends_on:
      demo-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; resp = urllib.request.urlopen('http://localhost:8080/health', timeout=3); exit(0 if resp.status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M

  traffic-generator:
    build:
      context: ./infrastructure/traffic-generator
      dockerfile: Dockerfile
    container_name: traffic-generator
    environment:
      - TARGET_URL=${TARGET_URL:-http://demo-app:8080}
      - REQUESTS_PER_SECOND=${REQUESTS_PER_SECOND:-5}
    restart: unless-stopped
    depends_on:
      demo-app:
        condition: service_healthy
    labels:
      - "monitor=true"
    deploy:
      resources:
        limits:
          memory: 128M

  events-agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: events-agent
    restart: unless-stopped
    environment:
      - BACKEND_URL=http://backend:8000
      - AGENT_SHARED_SECRET=${AGENT_SHARED_SECRET}
      - LABEL_FILTER=monitor=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  demo_postgres_data:
  demo_app_data:
