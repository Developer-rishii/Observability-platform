name: CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - production
  pull_request:
    branches:
      - dev
      - production

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ci_test_user
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: ci_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Backend Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python Syntax
        run: |
          cd backend
          python -m py_compile app/main.py

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql://ci_test_user:ci_test_password@localhost:5432/ci_test_db
        run: |
          cd backend
          alembic upgrade head

      - name: Run Tests
        env:
          DATABASE_URL: postgresql://ci_test_user:ci_test_password@localhost:5432/ci_test_db
          JWT_SECRET: ci-test-fake-jwt-secret-not-for-prod
          AGENT_SHARED_SECRET: ci-test-fake-agent-secret
          FRONTEND_ORIGIN: http://localhost:5173
          GEMINI_API_KEY: fake-gemini-key
          SMTP_PASSWORD: fake-smtp-password
        run: |
          cd backend
          pytest

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

  docker-build:
    name: Docker Build CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Backend Image
        run: |
          docker build -t observability-backend:latest ./backend
