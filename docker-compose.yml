version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-observability}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/observability
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - JWT_SECRET=${JWT_SECRET:-change-me}
      - JWT_EXPIRY_MINUTES=${JWT_EXPIRY_MINUTES:-1440}
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-http://localhost:5173}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - BACKEND_URL=${BACKEND_URL:-http://localhost:8000}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-CHANGE_ME_BEFORE_SEEDING}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-rushikeshsawarkar14@gmail.com}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-adql nbjf rcrz pitx}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-rushikeshsawarkar14@gmail.com}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-AetherPulse Cloud Observability}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      - PROMETHEUS_URL=${PROMETHEUS_URL:-http://prometheus:9090}
      - LOKI_URL=${LOKI_URL:-http://host.docker.internal:3100}
      - DETECTION_INTERVAL_SECONDS=${DETECTION_INTERVAL_SECONDS:-15}
      - DETECTION_CONSECUTIVE_BREACHES=${DETECTION_CONSECUTIVE_BREACHES:-3}
      - DETECTION_RECOVERY_CHECKS=${DETECTION_RECOVERY_CHECKS:-3}
      - CPU_THRESHOLD_PCT=${CPU_THRESHOLD_PCT:-80.0}
      - MEM_THRESHOLD_PCT=${MEM_THRESHOLD_PCT:-85.0}
      - DISK_THRESHOLD_PCT=${DISK_THRESHOLD_PCT:-90.0}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-your_gemini_api_key_here}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-pro}
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-30}
      - AGENT_SHARED_SECRET=${AGENT_SHARED_SECRET:-supersecretagentkey123}
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - qdrant


  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  workload-generator:
    build:
      context: ./infrastructure/workload-generator
      dockerfile: Dockerfile
    ports:
      - "${WORKLOAD_HOST_PORT:-8081}:8080"

volumes:
  postgres_data:
  qdrant_data:
  prometheus_data:
