global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']
    relabel_configs:
      - target_label: instance
        replacement: 'primary-node-host'

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['host.docker.internal:8080']
    relabel_configs:
      - target_label: instance
        replacement: 'docker-containers'

  - job_name: 'workload-generator'
    static_configs:
      - targets: ['workload-generator:8080']

